<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinebite - Movies & TV Shows</title>

    <!-- FAVICONS -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apple Touch -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme -->
    <meta name="theme-color" content="#020617" />

    <!-- SEO -->
    <meta
      name="description"
      content="Discover trending movies and TV shows. Build your personal watchlist with CineBite."
    />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="CineBite" />

    <!-- Open Graph -->
    <meta property="og:title" content="CineBite" />
    <meta
      property="og:description"
      content="Explore movies & TV shows. Save your watchlist with CineBite."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/web-app-manifest-512x512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
